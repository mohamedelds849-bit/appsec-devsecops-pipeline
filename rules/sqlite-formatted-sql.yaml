rules:
  - id: sqlite-formatted-sql
    message: >-
      SQL text built with an f-string, %, .format() or + . Pass values as parameters
      instead: cursor.execute("... WHERE id = ?", (value,)).
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A03:2021 - Injection"
      asvs: "V5.3.4"
      confidence: HIGH
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Query_Parameterization_Cheat_Sheet.html
    patterns:
      - pattern-either:
          - pattern: $C.$EXEC(f"...", ...)
          - pattern: $C.$EXEC("..." % $X, ...)
          - pattern: $C.$EXEC("...".format(...), ...)
          - pattern: $C.$EXEC("..." + $X, ...)
          - pattern: $C.$EXEC($X + "...", ...)
          - patterns:
              - pattern-inside: |
                  $Q = f"..."
                  ...
              - pattern: $C.$EXEC($Q, ...)
          - patterns:
              - pattern-inside: |
                  $Q = "..." + $X
                  ...
              - pattern: $C.$EXEC($Q, ...)
      # Only DB-API methods, so the rule does not fire on unrelated calls.
      - metavariable-regex:
          metavariable: $EXEC
          regex: ^(execute|executemany|executescript)$
